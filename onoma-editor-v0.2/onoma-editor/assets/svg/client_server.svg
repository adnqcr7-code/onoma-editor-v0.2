<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark background -->
  <rect width="800" height="600" fill="#0a0a0a"/>
  
  <!-- Client -->
  <circle cx="200" cy="300" r="60" fill="none" stroke="#e0e0e0" stroke-width="2"/>
  <text x="200" y="310" text-anchor="middle" fill="#e0e0e0" font-family="Arial, sans-serif" font-size="40">Client</text>
  
  <!-- Server -->
  <circle cx="600" cy="300" r="60" fill="none" stroke="#e0e0e0" stroke-width="2"/>
  <text x="600" y="310" text-anchor="middle" fill="#e0e0e0" font-family="Arial, sans-serif" font-size="40">Server</text>
  
  <!-- HTTP connection -->
  <line x1="260" y1="300" x2="540" y2="300" stroke="#3ecf8e" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="400" y="280" text-anchor="middle" fill="#3ecf8e" font-family="Arial, sans-serif" font-size="40">HTTP</text>
</svg>