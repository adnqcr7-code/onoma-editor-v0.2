<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="600" fill="#0a0a0a"/>
  
  <!-- Binary search visualization -->
  <!-- Array elements -->
  <circle cx="150" cy="300" r="30" fill="none" stroke="#e0e0e0" stroke-width="1"/>
  <text x="150" y="305" text-anchor="middle" fill="#e0e0e0" font-family="Arial, sans-serif" font-size="34">1</text>
  
  <circle cx="300" cy="300" r="30" fill="none" stroke="#e0e0e0" stroke-width="1"/>
  <text x="300" y="305" text-anchor="middle" fill="#e0e0e0" font-family="Arial, sans-serif" font-size="34">3</text>
  
  <circle cx="450" cy="300" r="30" fill="none" stroke="#e0e0e0" stroke-width="1"/>
  <text x="450" y="305" text-anchor="middle" fill="#e0e0e0" font-family="Arial, sans-serif" font-size="34">5</text>
  
  <circle cx="600" cy="300" r="30" fill="none" stroke="#e0e0e0" stroke-width="1"/>
  <text x="600" y="305" text-anchor="middle" fill="#e0e0e0" font-family="Arial, sans-serif" font-size="34">7</text>
  
  <circle cx="750" cy="300" r="30" fill="none" stroke="#e0e0e0" stroke-width="1"/>
  <text x="750" y="305" text-anchor="middle" fill="#e0e0e0" font-family="Arial, sans-serif" font-size="34">9</text>
  
  <!-- Middle element highlight -->
  <circle cx="450" cy="300" r="35" fill="none" stroke="#3ecf8e" stroke-width="2"/>
  
  <!-- Search arrow -->
  <path d="M 400 200 L 450 250" stroke="#3ecf8e" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Labels -->
  <text x="400" y="180" text-anchor="middle" fill="#e0e0e0" font-family="Arial, sans-serif" font-size="34">MIDDLE</text>
  <text x="150" y="380" text-anchor="middle" fill="#e0e0e0" font-family="Arial, sans-serif" font-size="34">LOW</text>
  <text x="750" y="380" text-anchor="middle" fill="#e0e0e0" font-family="Arial, sans-serif" font-size="34">HIGH</text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#3ecf8e"/>
    </marker>
  </defs>
</svg>