<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#0a0a0a"/>
  
  <!-- Main line -->
  <line x1="100" y1="300" x2="700" y2="300" stroke="#e0e0e0" stroke-width="2"/>
  
  <!-- Branch line -->
  <line x1="300" y1="300" x2="300" y2="150" stroke="#e0e0e0" stroke-width="2"/>
  <line x1="300" y1="150" x2="500" y2="150" stroke="#e0e0e0" stroke-width="2"/>
  
  <!-- Merge line -->
  <line x1="500" y1="150" x2="500" y2="300" stroke="#e0e0e0" stroke-width="2"/>
  
  <!-- Commit nodes on main -->
  <circle cx="100" cy="300" r="8" fill="none" stroke="#e0e0e0" stroke-width="2"/>
  <circle cx="300" cy="300" r="8" fill="none" stroke="#e0e0e0" stroke-width="2"/>
  <circle cx="500" cy="300" r="8" fill="none" stroke="#e0e0e0" stroke-width="2"/>
  <circle cx="700" cy="300" r="8" fill="none" stroke="#e0e0e0" stroke-width="2"/>
  
  <!-- Commit nodes on branch -->
  <circle cx="300" cy="150" r="8" fill="none" stroke="#e0e0e0" stroke-width="2"/>
  <circle cx="500" cy="150" r="8" fill="none" stroke="#3ecf8e" stroke-width="2"/>
  
  <!-- Labels -->
  <text x="100" y="340" font-family="Arial, sans-serif" font-size="34" fill="#e0e0e0" text-anchor="middle">main</text>
  <text x="400" y="130" font-family="Arial, sans-serif" font-size="34" fill="#3ecf8e" text-anchor="middle">branch</text>
  <text x="500" y="340" font-family="Arial, sans-serif" font-size="34" fill="#e0e0e0" text-anchor="middle">merge</text>
</svg>