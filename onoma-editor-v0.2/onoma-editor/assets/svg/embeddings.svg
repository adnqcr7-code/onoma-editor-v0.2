<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="600" fill="#0a0a0a"/>
  
  <!-- Vector space grid -->
  <g stroke="#e0e0e0" stroke-width="1" opacity="0.3">
    <line x1="100" y1="100" x2="700" y2="100"/>
    <line x1="100" y1="200" x2="700" y2="200"/>
    <line x1="100" y1="300" x2="700" y2="300"/>
    <line x1="100" y1="400" x2="700" y2="400"/>
    <line x1="100" y1="500" x2="700" y2="500"/>
    
    <line x1="100" y1="100" x2="100" y2="500"/>
    <line x1="200" y1="100" x2="200" y2="500"/>
    <line x1="300" y1="100" x2="300" y2="500"/>
    <line x1="400" y1="100" x2="400" y2="500"/>
    <line x1="500" y1="100" x2="500" y2="500"/>
    <line x1="600" y1="100" x2="600" y2="500"/>
    <line x1="700" y1="100" x2="700" y2="500"/>
  </g>
  
  <!-- Axes -->
  <line x1="100" y1="500" x2="700" y2="500" stroke="#e0e0e0" stroke-width="2"/>
  <line x1="100" y1="500" x2="100" y2="100" stroke="#e0e0e0" stroke-width="2"/>
  
  <!-- Axis labels -->
  <text x="720" y="505" fill="#e0e0e0" font-family="Arial, sans-serif" font-size="34" text-anchor="start">DIM1</text>
  <text x="105" y="90" fill="#e0e0e0" font-family="Arial, sans-serif" font-size="34" text-anchor="start">DIM2</text>
  
  <!-- Embedding points -->
  <circle cx="200" cy="400" r="20" fill="none" stroke="#3ecf8e" stroke-width="2"/>
  <circle cx="250" cy="380" r="20" fill="none" stroke="#3ecf8e" stroke-width="2"/>
  <circle cx="230" cy="420" r="20" fill="none" stroke="#3ecf8e" stroke-width="2"/>
  
  <circle cx="500" cy="200" r="20" fill="none" stroke="#3ecf8e" stroke-width="2"/>
  <circle cx="480" cy="230" r="20" fill="none" stroke="#3ecf8e" stroke-width="2"/>
  <circle cx="520" cy="180" r="20" fill="none" stroke="#3ecf8e" stroke-width="2"/>
  
  <circle cx="350" cy="300" r="20" fill="none" stroke="#e0e0e0" stroke-width="2" stroke-dasharray="5,5"/>
  <circle cx="400" cy="320" r="20" fill="none" stroke="#e0e0e0" stroke-width="2" stroke-dasharray="5,5"/>
  
  <!-- Cluster labels -->
  <text x="200" y="460" fill="#3ecf8e" font-family="Arial, sans-serif" font-size="34" text-anchor="middle">CATS</text>
  <text x="500" y="160" fill="#3ecf8e" font-family="Arial, sans-serif" font-size="34" text-anchor="middle">DOGS</text>
  
  <!-- Title -->
  <text x="400" y="50" fill="#e0e0e0" font-family="Arial, sans-serif" font-size="34" text-anchor="middle" font-weight="bold">EMBEDDINGS</text>
</svg>