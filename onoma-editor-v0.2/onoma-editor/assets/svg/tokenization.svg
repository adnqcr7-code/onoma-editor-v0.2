<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#0a0a0a"/>
  
  <!-- Text input -->
  <text x="100" y="200" font-family="Arial, sans-serif" font-size="34" fill="#e0e0e0">Text Input</text>
  <rect x="80" y="220" width="140" height="60" rx="4" fill="none" stroke="#e0e0e0" stroke-width="1.5"/>
  
  <!-- Tokenization process -->
  <path d="M 220 250 L 320 250" stroke="#3ecf8e" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="270" y="240" font-family="Arial, sans-serif" font-size="34" fill="#3ecf8e" text-anchor="middle">Tokenize</text>
  
  <!-- Tokens -->
  <circle cx="380" cy="200" r="30" fill="none" stroke="#e0e0e0" stroke-width="1.5"/>
  <text x="380" y="207" font-family="Arial, sans-serif" font-size="34" fill="#e0e0e0" text-anchor="middle">Token</text>
  
  <circle cx="380" cy="250" r="30" fill="none" stroke="#e0e0e0" stroke-width="1.5"/>
  <text x="380" y="257" font-family="Arial, sans-serif" font-size="34" fill="#e0e0e0" text-anchor="middle">Token</text>
  
  <circle cx="380" cy="300" r="30" fill="none" stroke="#e0e0e0" stroke-width="1.5"/>
  <text x="380" y="307" font-family="Arial, sans-serif" font-size="34" fill="#e0e0e0" text-anchor="middle">Token</text>
  
  <!-- Conversion to IDs -->
  <path d="M 410 250 L 510 250" stroke="#3ecf8e" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="460" y="240" font-family="Arial, sans-serif" font-size="34" fill="#3ecf8e" text-anchor="middle">Convert</text>
  
  <!-- Token IDs -->
  <rect x="530" y="180" width="80" height="40" rx="4" fill="none" stroke="#e0e0e0" stroke-width="1.5"/>
  <text x="570" y="205" font-family="Arial, sans-serif" font-size="34" fill="#e0e0e0" text-anchor="middle">ID 42</text>
  
  <rect x="530" y="230" width="80" height="40" rx="4" fill="none" stroke="#e0e0e0" stroke-width="1.5"/>
  <text x="570" y="255" font-family="Arial, sans-serif" font-size="34" fill="#e0e0e0" text-anchor="middle">ID 15</text>
  
  <rect x="530" y="280" width="80" height="40" rx="4" fill="none" stroke="#e0e0e0" stroke-width="1.5"/>
  <text x="570" y="305" font-family="Arial, sans-serif" font-size="34" fill="#e0e0e0" text-anchor="middle">ID 73</text>
  
  <!-- Model input -->
  <path d="M 610 250 L 690 250" stroke="#3ecf8e" stroke-width="1.5"/>
  <text x="650" y="240" font-family="Arial, sans-serif" font-size="34" fill="#3ecf8e" text-anchor="middle">Model</text>
  
  <!-- Model representation -->
  <rect x="700" y="210" width="60" height="80" rx="4" fill="none" stroke="#e0e0e0" stroke-width="1.5"/>
  <circle cx="730" cy="230" r="8" fill="none" stroke="#e0e0e0" stroke-width="1.5"/>
  <circle cx="730" cy="250" r="8" fill="none" stroke="#e0e0e0" stroke-width="1.5"/>
  <circle cx="730" cy="270" r="8" fill="none" stroke="#e0e0e0" stroke-width="1.5"/>
</svg>