<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#0a0a0a"/>
  
  <!-- Input -->
  <rect x="300" y="40" width="200" height="60" rx="4" fill="none" stroke="#e0e0e0" stroke-width="2"/>
  <text x="400" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" fill="#e0e0e0">In</text>
  
  <!-- Arrow from Input to Attention -->
  <line x1="400" y1="100" x2="400" y2="140" stroke="#e0e0e0" stroke-width="2"/>
  <polygon points="400,150 395,140 405,140" fill="#e0e0e0"/>
  
  <!-- Attention Block -->
  <rect x="300" y="160" width="200" height="60" rx="4" fill="none" stroke="#3ecf8e" stroke-width="2"/>
  <text x="400" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" fill="#3ecf8e">Attn</text>
  
  <!-- Arrow from Attention to Layer Norm -->
  <line x1="400" y1="220" x2="400" y2="260" stroke="#e0e0e0" stroke-width="2"/>
  <polygon points="400,270 395,260 405,260" fill="#e0e0e0"/>
  
  <!-- Layer Norm Block -->
  <rect x="300" y="280" width="200" height="60" rx="4" fill="none" stroke="#e0e0e0" stroke-width="2"/>
  <text x="400" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" fill="#e0e0e0">Norm</text>
  
  <!-- Arrow from Layer Norm to Feed Forward -->
  <line x1="400" y1="340" x2="400" y2="380" stroke="#e0e0e0" stroke-width="2"/>
  <polygon points="400,390 395,380 405,380" fill="#e0e0e0"/>
  
  <!-- Feed Forward Block -->
  <rect x="300" y="400" width="200" height="60" rx="4" fill="none" stroke="#3ecf8e" stroke-width="2"/>
  <text x="400" y="435" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" fill="#3ecf8e">FFN</text>
  
  <!-- Arrow from Feed Forward to Output -->
  <line x1="400" y1="460" x2="400" y2="500" stroke="#e0e0e0" stroke-width="2"/>
  <polygon points="400,510 395,500 405,500" fill="#e0e0e0"/>
  
  <!-- Output -->
  <rect x="300" y="520" width="200" height="60" rx="4" fill="none" stroke="#e0e0e0" stroke-width="2"/>
  <text x="400" y="555" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" fill="#e0e0e0">Out</text>
  
  <!-- Residual connections (dotted lines) -->
  <line x1="250" y1="190" x2="300" y2="190" stroke="#e0e0e0" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="500" y1="190" x2="550" y2="190" stroke="#e0e0e0" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="550" y1="190" x2="550" y2="310" stroke="#e0e0e0" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="550" y1="310" x2="500" y2="310" stroke="#e0e0e0" stroke-width="2" stroke-dasharray="5,5"/>
  
  <line x1="250" y1="430" x2="300" y2="430" stroke="#e0e0e0" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="500" y1="430" x2="550" y2="430" stroke="#e0e0e0" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="550" y1="430" x2="550" y2="550" stroke="#e0e0e0" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="550" y1="550" x2="500" y2="550" stroke="#e0e0e0" stroke-width="2" stroke-dasharray="5,5"/>
</svg>