<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="600" fill="#0a0a0a"/>
  
  <!-- Input tokens -->
  <circle cx="150" cy="150" r="40" fill="none" stroke="#e0e0e0" stroke-width="2"/>
  <text x="150" y="155" text-anchor="middle" fill="#e0e0e0" font-family="Arial, sans-serif" font-size="34">Q</text>
  
  <circle cx="150" cy="300" r="40" fill="none" stroke="#e0e0e0" stroke-width="2"/>
  <text x="150" y="305" text-anchor="middle" fill="#e0e0e0" font-family="Arial, sans-serif" font-size="34">K</text>
  
  <circle cx="150" cy="450" r="40" fill="none" stroke="#e0e0e0" stroke-width="2"/>
  <text x="150" y="455" text-anchor="middle" fill="#e0e0e0" font-family="Arial, sans-serif" font-size="34">V</text>
  
  <!-- Attention mechanism -->
  <circle cx="400" cy="300" r="60" fill="none" stroke="#3ecf8e" stroke-width="2"/>
  <text x="400" y="305" text-anchor="middle" fill="#3ecf8e" font-family="Arial, sans-serif" font-size="34">ATTN</text>
  
  <!-- Output -->
  <circle cx="650" cy="300" r="40" fill="none" stroke="#e0e0e0" stroke-width="2"/>
  <text x="650" y="305" text-anchor="middle" fill="#e0e0e0" font-family="Arial, sans-serif" font-size="34">OUT</text>
  
  <!-- Connections -->
  <line x1="190" y1="150" x2="340" y2="270" stroke="#e0e0e0" stroke-width="1.5"/>
  <line x1="190" y1="300" x2="340" y2="300" stroke="#e0e0e0" stroke-width="1.5"/>
  <line x1="190" y1="450" x2="340" y2="330" stroke="#e0e0e0" stroke-width="1.5"/>
  
  <line x1="460" y1="300" x2="610" y2="300" stroke="#3ecf8e" stroke-width="1.5"/>
  
  <!-- Dotted lines for uncertainty -->
  <line x1="150" y1="190" x2="150" y2="260" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="150" y1="340" x2="150" y2="410" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="5,5"/>
  
  <!-- Labels -->
  <text x="400" y="80" text-anchor="middle" fill="#e0e0e0" font-family="Arial, sans-serif" font-size="34">WEIGH</text>
  <text x="400" y="520" text-anchor="middle" fill="#e0e0e0" font-family="Arial, sans-serif" font-size="34">SCORE</text>
</svg>