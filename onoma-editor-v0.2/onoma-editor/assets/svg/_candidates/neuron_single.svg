<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#0a0a0a"/>
  
  <!-- Input nodes -->
  <circle cx="150" cy="150" r="30" fill="none" stroke="#e0e0e0" stroke-width="2"/>
  <text x="150" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" fill="#e0e0e0">x1</text>
  
  <circle cx="150" cy="300" r="30" fill="none" stroke="#e0e0e0" stroke-width="2"/>
  <text x="150" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" fill="#e0e0e0">x2</text>
  
  <circle cx="150" cy="450" r="30" fill="none" stroke="#e0e0e0" stroke-width="2"/>
  <text x="150" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" fill="#e0e0e0">x3</text>
  
  <!-- Neuron -->
  <circle cx="400" cy="300" r="50" fill="none" stroke="#3ecf8e" stroke-width="2"/>
  <text x="400" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" fill="#3ecf8e">Σ</text>
  
  <!-- Output -->
  <circle cx="650" cy="300" r="30" fill="none" stroke="#e0e0e0" stroke-width="2"/>
  <text x="650" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" fill="#e0e0e0">y</text>
  
  <!-- Connections with weights -->
  <line x1="180" y1="150" x2="350" y2="270" stroke="#e0e0e0" stroke-width="2"/>
  <text x="250" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" fill="#e0e0e0">w1</text>
  
  <line x1="180" y1="300" x2="350" y2="300" stroke="#e0e0e0" stroke-width="2"/>
  <text x="250" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" fill="#e0e0e0">w2</text>
  
  <line x1="180" y1="450" x2="350" y2="330" stroke="#e0e0e0" stroke-width="2"/>
  <text x="250" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" fill="#e0e0e0">w3</text>
  
  <line x1="450" y1="300" x2="620" y2="300" stroke="#e0e0e0" stroke-width="2"/>
  <text x="535" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" fill="#e0e0e0">f</text>
  
  <!-- Activation function label -->
  <text x="535" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" fill="#3ecf8e">activation</text>
</svg>