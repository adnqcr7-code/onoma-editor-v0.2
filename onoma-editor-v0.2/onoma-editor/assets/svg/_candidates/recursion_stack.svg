<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="600" fill="#0a0a0a"/>
  
  <!-- Call stack frames -->
  <g stroke="#e0e0e0" stroke-width="1.5" fill="none">
    <rect x="300" y="100" width="200" height="80" rx="4"/>
    <rect x="300" y="200" width="200" height="80" rx="4"/>
    <rect x="300" y="300" width="200" height="80" rx="4"/>
    <rect x="300" y="400" width="200" height="80" rx="4"/>
  </g>
  
  <!-- Function calls -->
  <g fill="#3ecf8e" font-family="Arial, sans-serif" font-size="36">
    <text x="400" y="145" text-anchor="middle">func(n)</text>
    <text x="400" y="245" text-anchor="middle">func(n-1)</text>
    <text x="400" y="345" text-anchor="middle">func(n-2)</text>
    <text x="400" y="445" text-anchor="middle">func(n-3)</text>
  </g>
  
  <!-- Stack arrows -->
  <g stroke="#e0e0e0" stroke-width="1.5" fill="none">
    <path d="M 250 140 L 290 140" marker-end="url(#arrowhead)"/>
    <path d="M 250 240 L 290 240" marker-end="url(#arrowhead)"/>
    <path d="M 250 340 L 290 340" marker-end="url(#arrowhead)"/>
    <path d="M 250 440 L 290 440" marker-end="url(#arrowhead)"/>
  </g>
  
  <!-- Return path -->
  <path d="M 520 440 Q 560 440 560 240 Q 560 140 520 140" 
        stroke="#3ecf8e" stroke-width="2" fill="none" 
        stroke-dasharray="8,4" marker-end="url(#arrowhead-green)"/>
  
  <!-- Labels -->
  <g fill="#e0e0e0" font-family="Arial, sans-serif" font-size="34">
    <text x="180" y="145" text-anchor="end">PUSH</text>
    <text x="580" y="240" text-anchor="start">UNWIND</text>
  </g>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" 
            refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e0e0e0"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" 
            refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3ecf8e"/>
    </marker>
  </defs>
</svg>