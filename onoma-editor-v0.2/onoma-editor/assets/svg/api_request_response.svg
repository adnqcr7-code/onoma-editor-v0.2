<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#0a0a0a"/>
  
  <!-- Client Node -->
  <circle cx="150" cy="300" r="50" fill="none" stroke="#e0e0e0" stroke-width="2"/>
  <text x="150" y="305" font-family="Arial, sans-serif" font-size="34" fill="#e0e0e0" text-anchor="middle">CLIENT</text>
  
  <!-- Server Node -->
  <circle cx="650" cy="300" r="50" fill="none" stroke="#e0e0e0" stroke-width="2"/>
  <text x="650" y="305" font-family="Arial, sans-serif" font-size="34" fill="#e0e0e0" text-anchor="middle">SERVER</text>
  
  <!-- Request Arrow -->
  <line x1="200" y1="280" x2="600" y2="280" stroke="#3ecf8e" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="400" y="265" font-family="Arial, sans-serif" font-size="34" fill="#3ecf8e" text-anchor="middle">REQUEST</text>
  
  <!-- Response Arrow -->
  <line x1="600" y1="320" x2="200" y2="320" stroke="#3ecf8e" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="400" y="345" font-family="Arial, sans-serif" font-size="34" fill="#3ecf8e" text-anchor="middle">RESPONSE</text>
  
  <!-- Arrow Marker Definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3ecf8e"/>
    </marker>
  </defs>
  
  <!-- Status Code -->
  <circle cx="650" cy="200" r="30" fill="none" stroke="#e0e0e0" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="650" y="205" font-family="Arial, sans-serif" font-size="34" fill="#e0e0e0" text-anchor="middle">STATUS</text>
  
  <!-- Payload -->
  <circle cx="650" cy="400" r="30" fill="none" stroke="#e0e0e0" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="650" y="405" font-family="Arial, sans-serif" font-size="34" fill="#e0e0e0" text-anchor="middle">PAYLOAD</text>
  
  <!-- Connecting lines to status and payload -->
  <line x1="650" y1="250" x2="650" y2="230" stroke="#e0e0e0" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="650" y1="350" x2="650" y2="370" stroke="#e0e0e0" stroke-width="1.5" stroke-dasharray="5,3"/>
</svg>