<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#0a0a0a"/>
  
  <!-- Loss surface (contour lines) -->
  <ellipse cx="400" cy="300" rx="300" ry="200" fill="none" stroke="#e0e0e0" stroke-width="1" opacity="0.3"/>
  <ellipse cx="400" cy="300" rx="250" ry="170" fill="none" stroke="#e0e0e0" stroke-width="1" opacity="0.3"/>
  <ellipse cx="400" cy="300" rx="200" ry="140" fill="none" stroke="#e0e0e0" stroke-width="1" opacity="0.3"/>
  <ellipse cx="400" cy="300" rx="150" ry="110" fill="none" stroke="#e0e0e0" stroke-width="1" opacity="0.3"/>
  <ellipse cx="400" cy="300" rx="100" ry="80" fill="none" stroke="#e0e0e0" stroke-width="1" opacity="0.3"/>
  
  <!-- Gradient descent path -->
  <path d="M 600,200 Q 500,250 400,300 Q 350,350 300,400" fill="none" stroke="#3ecf8e" stroke-width="2" stroke-dasharray="5,3"/>
  
  <!-- Current position marker -->
  <circle cx="300" cy="400" r="8" fill="#3ecf8e"/>
  
  <!-- Previous positions -->
  <circle cx="400" cy="300" r="6" fill="#e0e0e0" opacity="0.7"/>
  <circle cx="500" cy="250" r="6" fill="#e0e0e0" opacity="0.7"/>
  <circle cx="600" cy="200" r="6" fill="#e0e0e0" opacity="0.7"/>
  
  <!-- Slope indicator -->
  <line x1="300" y1="400" x2="350" y2="350" stroke="#e0e0e0" stroke-width="1" opacity="0.5"/>
  <polygon points="350,350 340,355 345,365" fill="#e0e0e0" opacity="0.5"/>
  
  <!-- Labels -->
  <text x="300" y="440" font-family="Arial, sans-serif" font-size="36" fill="#e0e0e0" text-anchor="middle">CURRENT</text>
  <text x="400" y="340" font-family="Arial, sans-serif" font-size="36" fill="#e0e0e0" text-anchor="middle">PREVIOUS</text>
  <text x="600" y="170" font-family="Arial, sans-serif" font-size="36" fill="#e0e0e0" text-anchor="middle">START</text>
  <text x="400" y="480" font-family="Arial, sans-serif" font-size="36" fill="#3ecf8e" text-anchor="middle">GRADIENT DESCENT</text>
</svg>