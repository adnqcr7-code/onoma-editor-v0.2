<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#0a0a0a"/>
  
  <!-- Input Layer -->
  <g id="input-layer">
    <circle cx="150" cy="150" r="30" fill="none" stroke="#e0e0e0" stroke-width="2"/>
    <circle cx="150" cy="250" r="30" fill="none" stroke="#e0e0e0" stroke-width="2"/>
    <circle cx="150" cy="350" r="30" fill="none" stroke="#e0e0e0" stroke-width="2"/>
    <circle cx="150" cy="450" r="30" fill="none" stroke="#e0e0e0" stroke-width="2"/>
    <text x="150" y="510" fill="#e0e0e0" font-family="Arial, sans-serif" font-size="34" text-anchor="middle">input</text>
  </g>
  
  <!-- Hidden Layer 1 -->
  <g id="hidden-layer-1">
    <circle cx="400" cy="200" r="30" fill="none" stroke="#e0e0e0" stroke-width="2"/>
    <circle cx="400" cy="300" r="30" fill="none" stroke="#e0e0e0" stroke-width="2"/>
    <circle cx="400" cy="400" r="30" fill="none" stroke="#e0e0e0" stroke-width="2"/>
    <text x="400" y="510" fill="#e0e0e0" font-family="Arial, sans-serif" font-size="34" text-anchor="middle">hidden</text>
  </g>
  
  <!-- Hidden Layer 2 -->
  <g id="hidden-layer-2">
    <circle cx="550" cy="250" r="30" fill="none" stroke="#e0e0e0" stroke-width="2"/>
    <circle cx="550" cy="350" r="30" fill="none" stroke="#e0e0e0" stroke-width="2"/>
    <text x="550" y="510" fill="#e0e0e0" font-family="Arial, sans-serif" font-size="34" text-anchor="middle">hidden</text>
  </g>
  
  <!-- Output Layer -->
  <g id="output-layer">
    <circle cx="700" cy="300" r="30" fill="none" stroke="#e0e0e0" stroke-width="2"/>
    <text x="700" y="510" fill="#e0e0e0" font-family="Arial, sans-serif" font-size="34" text-anchor="middle">output</text>
  </g>
  
  <!-- Connections from Input to Hidden 1 -->
  <g id="connections-input-hidden1" stroke="#3ecf8e" stroke-width="1.5" fill="none">
    <line x1="180" y1="150" x2="370" y2="200" stroke-dasharray="5,3"/>
    <line x1="180" y1="150" x2="370" y2="300"/>
    <line x1="180" y1="150" x2="370" y2="400"/>
    
    <line x1="180" y1="250" x2="370" y2="200"/>
    <line x1="180" y1="250" x2="370" y2="300"/>
    <line x1="180" y1="250" x2="370" y2="400"/>
    
    <line x1="180" y1="350" x2="370" y2="200"/>
    <line x1="180" y1="350" x2="370" y2="300"/>
    <line x1="180" y1="350" x2="370" y2="400"/>
    
    <line x1="180" y1="450" x2="370" y2="200"/>
    <line x1="180" y1="450" x2="370" y2="300"/>
    <line x1="180" y1="450" x2="370" y2="400"/>
  </g>
  
  <!-- Connections from Hidden 1 to Hidden 2 -->
  <g id="connections-hidden1-hidden2" stroke="#e0e0e0" stroke-width="1.5" fill="none">
    <line x1="430" y1="200" x2="520" y2="250"/>
    <line x1="430" y1="200" x2="520" y2="350"/>
    
    <line x1="430" y1="300" x2="520" y2="250"/>
    <line x1="430" y1="300" x2="520" y2="350"/>
    
    <line x1="430" y1="400" x2="520" y2="250"/>
    <line x1="430" y1="400" x2="520" y2="350"/>
  </g>
  
  <!-- Connections from Hidden 2 to Output -->
  <g id="connections-hidden2-output" stroke="#e0e0e0" stroke-width="1.5" fill="none">
    <line x1="580" y1="250" x2="670" y2="300"/>
    <line x1="580" y1="350" x2="670" y2="300"/>
  </g>
</svg>